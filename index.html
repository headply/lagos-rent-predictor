<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-indigo-600">ChurnPredict</h1>
            <p class="text-gray-600 mt-1">Telecom Customer Churn Prediction Service</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-bold text-gray-900 mb-4">Predict Customer Churn</h2>
                <p class="text-lg text-gray-600">Enter customer information to predict churn probability</p>
            </div>

            <!-- Form -->
            <form id="churnForm" class="space-y-6">
                <!-- Numerical Features -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Tenure (months)</label>
                        <input type="number" id="tenure" min="0" value="12" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Monthly Charges ($)</label>
                        <input type="number" id="monthly_charges" step="0.01" min="0" value="70.00"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Total Charges ($)</label>
                        <input type="number" id="total_charges" step="0.01" min="0" value="840.00"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </div>

                <!-- Categorical Features -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Contract Type</label>
                        <select id="contract_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Payment Method</label>
                        <select id="payment_method" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="Electronic check">Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer">Bank transfer</option>
                            <option value="Credit card">Credit card</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Internet Service</label>
                        <select id="internet_service" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="DSL">DSL</option>
                            <option value="Fiber optic">Fiber optic</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Online Security</label>
                        <select id="online_security" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Tech Support</label>
                        <select id="tech_support" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Streaming TV</label>
                        <select id="streaming_tv" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Streaming Movies</label>
                        <select id="streaming_movies" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full bg-indigo-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-indigo-700 transition duration-200 shadow-lg">
                    Predict Churn Risk
                </button>
            </form>

            <!-- Results -->
            <div id="results" class="mt-8 hidden">
                <div class="border-t pt-8">
                    <h3 class="text-2xl font-bold text-gray-900 mb-4">Prediction Results</h3>
                    <div id="resultContent" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5000';

        document.getElementById('churnForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                tenure: parseInt(document.getElementById('tenure').value),
                monthly_charges: parseFloat(document.getElementById('monthly_charges').value),
                total_charges: parseFloat(document.getElementById('total_charges').value),
                contract_type: document.getElementById('contract_type').value,
                payment_method: document.getElementById('payment_method').value,
                internet_service: document.getElementById('internet_service').value,
                online_security: document.getElementById('online_security').value,
                tech_support: document.getElementById('tech_support').value,
                streaming_tv: document.getElementById('streaming_tv').value,
                streaming_movies: document.getElementById('streaming_movies').value
            };

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    displayResults(result);
                } else {
                    alert('Prediction failed: ' + result.message);
                }
            } catch (error) {
                alert('Error connecting to API: ' + error.message);
            }
        });

        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            const contentDiv = document.getElementById('resultContent');
            
            const riskColor = result.risk_level === 'High' ? 'red' : 
                            result.risk_level === 'Medium' ? 'yellow' : 'green';
            
            contentDiv.innerHTML = `
                <div class="bg-${riskColor}-50 border-l-4 border-${riskColor}-500 p-6 rounded-lg">
                    <div class="flex items-center mb-4">
                        <span class="text-4xl font-bold text-${riskColor}-600">${(result.churn_probability * 100).toFixed(1)}%</span>
                        <span class="ml-4 text-xl text-gray-700">Churn Probability</span>
                    </div>
                    <div class="space-y-2">
                        <p class="text-lg"><strong>Prediction:</strong> ${result.churn_prediction === 1 ? 'Customer likely to churn' : 'Customer likely to stay'}</p>
                        <p class="text-lg"><strong>Risk Level:</strong> <span class="font-bold text-${riskColor}-600">${result.risk_level}</span></p>
                    </div>
                </div>
            `;
            
            resultsDiv.classList.remove('hidden');
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
